<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChargeGhar</title>
<meta name="description" content="Find EV chargers across India, or earn by sharing your own charger with drivers nearby.">
<meta name="theme-color" content="#064529">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChargeGhar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>
<div class="app">
  <header class="hd pad">
    <div class="hd-top">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M3 11.5 12 4l9 7.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5V20h12v-9.5" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M12.8 8.6 9.8 14h2.6l-.8 3.6 3.2-5.5h-2.6z" fill="#F5B50A"/></svg>
        </div>
        <div><h1>ChargeGhar</h1><div class="tagline">EV charging across India</div></div>
      </div>
      <button id="install" class="ins" data-act="install" hidden>Install app</button>
    </div>
    <div class="hd-ctl" id="hdctl">
      <label class="fld">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <select id="city" aria-label="City"></select>
      </label>
      <label class="fld" id="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="Search chargers" autocomplete="off" aria-label="Search chargers">
      </label>
    </div>
    <div class="sum" id="sum"></div>
  </header>
  <div class="road" aria-hidden="true"></div>
  <div id="offline" class="offline" role="status" hidden>You are offline. Saved sample data is shown.</div>
  <main id="view" class="pad"></main>
</div>

<nav class="tabs" aria-label="Main">
  <div class="tabs-in">
    <button class="tab" data-act="tab" data-t="find"><span class="ti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>Find</button>
    <button class="tab" data-act="tab" data-t="bookings"><span class="ti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></span>Bookings<span class="badge" hidden></span></button>
    <button class="tab" data-act="tab" data-t="host"><span class="ti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M12 12.5v5M9.5 15h5"/></svg></span>Host</button>
  </div>
</nav>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>
<script src="app.js"></script>
</body>
</html>
